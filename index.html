<style>
:root{
  --bg:#faf7ff; --card:#ffffff; --ink:#1d1638; --muted:#5d5878; --dim:#8b86a6; --line:#e6e0f5;
  --violet:#6b4ce6; --violet-d:#4f33c4; --violet-l:#efeaff;
  --pink:#ffd3ef; --lav:#e3dbff; --sky:#d3efff; --mint:#ccf5e4; --butter:#fff1b8; --peach:#ffdcc8; --teal:#c9f1f1; --rose:#ffd6dc;
  --good:#16794a; --good-bg:#dcf7e9; --warn:#a24a00; --warn-bg:#ffe9d6; --bad:#b4233a; --bad-bg:#ffe1e6;
  --display:"Fredoka", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--violet-d)}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack>*{min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#b9a6ff,#ff9fd8);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #8f78e8}
.logo svg{width:30px;height:30px}
.brand{min-width:0}
.brand .sub{color:var(--muted);font-size:.95rem}
.nav{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:800;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--violet-l);color:var(--violet-d)}
.nav .count{display:inline-block;min-width:1.5em;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--violet);color:#fff;font-size:.75rem;line-height:1.5em}
.who{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:.92rem}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(60,40,120,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-d);text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--violet-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c3cc;box-shadow:0 2px 0 #f3c3cc}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.big{padding:14px 26px;font-size:1.08rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--violet-d);font-weight:800;text-decoration:underline;text-underline-offset:3px}
label.lbl,.lbl{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(107,76,230,.15)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.field{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:.9rem}
.err{color:var(--bad);font-weight:700}
.note{background:var(--violet-l);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:.95rem}
.note.warn{background:var(--warn-bg)}
.note.good{background:var(--good-bg)}
.rotext{white-space:pre-wrap;background:#f6f4fc;border-radius:10px;padding:12px 14px;overflow-wrap:anywhere}
.pad-ink.ro{cursor:default;touch-action:auto}
#save-note.unsaved{color:var(--warn);font-weight:800}

/* pills & badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:800;background:var(--lav);color:var(--ink);white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:800;white-space:nowrap}
.pill.todo{background:#f1eff7;color:var(--muted)}
.pill.in{background:var(--lav);color:#432aa8}
.pill.done{background:var(--good-bg);color:var(--good)}
.pill.rev{background:var(--warn-bg);color:var(--warn)}
.pill.hid{background:#f1eff7;color:var(--muted)}
.pill.vis{background:var(--good-bg);color:var(--good)}
.pill.late{background:var(--bad-bg);color:var(--bad)}
.pill.draft{background:var(--butter);color:#6b4f00}

/* sign in */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-art{background:linear-gradient(160deg,var(--lav),var(--pink));border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px}
.hero-art .step{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.75);border-radius:14px;padding:10px 14px}
.hero-art .n{font-family:var(--display);font-weight:700;color:var(--violet-d);font-size:1.2rem;min-width:1.2em}

/* board */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem;font-weight:700}
.week h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.week h2 small{font-family:var(--body);font-size:.9rem;color:var(--dim);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{--tc:var(--lav);text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,40,120,.08)}
.pcard .band{background:var(--tc);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .band .t{font-weight:800;font-size:.85rem}
.pcard .band .pts{font-family:var(--display);font-weight:600}
.pcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard .ttl{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.25}
.pcard .meta{color:var(--muted);font-size:.88rem}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}.pcard:hover{transform:none}}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}

/* problem */
.phead{display:flex;flex-direction:column;gap:8px}
.prompt{font-size:1.05rem;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.prompt p+p{margin-top:0}
.prompt ul{margin:0;padding-left:1.3em}
.prompt img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.mdtable{overflow-x:auto}
.mdtable table{border-collapse:collapse;min-width:50%}
.mdtable th,.mdtable td{border:1px solid var(--line);padding:6px 12px;text-align:left}
.mdtable th{background:var(--violet-l);font-weight:800}
.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;gap:12px;align-items:flex-start}
.part-l{flex:none;width:34px;height:34px;border-radius:10px;background:var(--violet);color:#fff;font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:1.05rem}
.part-q{flex:1;min-width:0;padding-top:4px;font-weight:700;overflow-wrap:anywhere}
.part-q p{margin:0}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:0}
.wtab{border:0;background:none;padding:8px 14px;border-radius:10px 10px 0 0;font-weight:800;color:var(--muted);position:relative;margin-bottom:-2px;border-bottom:3px solid transparent}
.wtab[aria-selected="true"]{color:var(--violet-d);border-bottom-color:var(--violet);background:var(--violet-l)}
.wtab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}
.mkeys{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.mkey{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:38px;padding:4px 8px;font-weight:700}
.mkey:hover{border-color:var(--violet)}

/* drawing pad */
.pad-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tg{display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.tb{border:0;background:none;border-radius:7px;padding:5px 10px;font-weight:800;font-size:.88rem;color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--violet-l);color:var(--violet-d)}
.tb:disabled{opacity:.35;cursor:default}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;background:var(--sw);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--violet)}
.pad-wrap{position:relative;width:100%;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pad-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad-ink{touch-action:none;cursor:crosshair}
.pad-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* photos */
.phs{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:150px;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4f2fa}
.phsaved{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:.9rem;text-align:center;padding:8px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:6px;right:6px;border:0;border-radius:99px;background:rgba(29,22,56,.8);color:#fff;font-weight:800;padding:2px 9px}
.addph{width:150px;height:150px;border:2px dashed #cfc6ef;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--violet-d);font-weight:800;cursor:pointer;text-align:center;padding:10px}
.addph:hover{background:var(--violet-l)}

/* turn in bar */
.turnin{position:sticky;bottom:0;background:rgba(250,247,255,.94);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}

/* modal */
.modal{position:fixed;inset:0;background:rgba(29,22,56,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.mbox{background:#fff;border-radius:18px;width:min(620px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(29,22,56,.3);margin:auto 0}
.mbox.wide{width:min(900px,100%)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#f6f4fc}
.checks .ok{color:var(--good);font-weight:800}
.checks .no{color:var(--warn);font-weight:800}
.bigcheck{width:80px;height:80px;border-radius:50%;background:var(--good-bg);display:grid;place-items:center;margin:0 auto}
.spin{width:40px;height:40px;border:4px solid var(--lav);border-top-color:var(--violet);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad)}

/* work list */
.wlist{display:flex;flex-direction:column;gap:12px}
.witem{display:flex;flex-direction:column;gap:8px}
.fb{background:var(--good-bg);border-radius:12px;padding:10px 14px;white-space:pre-wrap}
.fb.rev{background:var(--warn-bg)}

/* teacher */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbfaff;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#faf8ff}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input{padding:6px 8px;border-radius:8px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.filters{grid-template-columns:minmax(0,1fr)}}
.resp{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px}
.resp .txt{white-space:pre-wrap;background:#f6f4fc;border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.resp img{max-width:100%;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:700}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--violet-l);border-color:var(--violet);color:var(--violet-d)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.partedit{display:flex;gap:8px;align-items:flex-start}
.partedit textarea{min-height:60px}
.imgprev{max-width:260px;border-radius:10px;border:1px solid var(--line);display:block}
.pv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fmt{background:#f6f4fc;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;white-space:pre-wrap;overflow-x:auto}
@media (max-width:640px){
  .turnin{padding:8px 0}
  .turnin .btn.big{padding:10px 20px;font-size:1rem}
  #draft-note{display:none}
  .logo{width:40px;height:40px;border-radius:12px}
  .logo svg{width:24px;height:24px}
  .top{gap:10px;padding-bottom:12px}
  .nav{margin-left:0;width:100%}
  .card{padding:16px}
}
footer.foot{text-align:center;padding:20px 16px 30px;color:var(--dim);font-size:.85rem}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 25h8M13 29h6"/><path d="M16 3a9 9 0 0 0-5.5 16.1c.9.7 1.5 1.8 1.5 2.9h8c0-1.1.6-2.2 1.5-2.9A9 9 0 0 0 16 3z"/><path d="M13 14l3 3 3-3"/></svg>
    </div>
    <div class="brand">

  <main id="app" class="stack" aria-live="polite">
    <div class="card empty"><div class="spin" aria-hidden="true"></div><p style="margin-top:12px">Loading challenges…</p></div>
  </main>
</div>
<footer class="foot"><span id="foot-who"></span> <button class="link" id="teacher-link" type="button">Teacher</button></footer>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";

/* ============ basics ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const ss = {
  get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { sessionStorage.removeItem(k); } catch {} }
};
/* ============ Supabase data layer ============ */
const CFG = window.THINK_BIGGER_CONFIG || {};
const configured = CFG.supabaseUrl && CFG.supabaseKey && !/PASTE/i.test(CFG.supabaseUrl + CFG.supabaseKey) && window.supabase;
const sb = configured ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
const START_VIEW = /(^|[?&#])(view=)?teacher\b/.test(location.search + location.hash) ? "teacher" : "student";
const IMG = {};   // problem id -> picture path
const RAW = {};   // submission id -> stored responses (with file paths)
const unwrap = ({ data, error }) => { if (error) throw new Error(error.message || "Something went wrong."); return data; };
const rpcOk = d => { if (d && d.error) throw new Error(d.error); return d; };
const rowToProblem = r => { IMG[r.id] = r.image_path || null; return {
  id: r.id, status: r.status, postDate: r.post_date || "", dueDate: r.due_date || "", title: r.title || "", type: r.type || "",
  units: r.units || "", topics: r.topics || "", points: Number(r.points) || 0, classes: r.classes || [], prompt: r.prompt || "",
  parts: Array.isArray(r.parts) ? r.parts : [], hasImage: !!r.image_path }; };
function dataUrlToBlob(u){
  const m = /^data:([^;]+);base64,(.*)$/.exec(u); const bin = atob(m[2]); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: m[1] });
}
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^0-9a-zA-Z-]/g, "");
async function uploadImage(bucket, folder, dataUrl){
  const blob = dataUrlToBlob(dataUrl);
  const ext = blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg";
  const path = `${folder}/${newId()}.${ext}`;
  unwrap(await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type, upsert: false }));
  return path;
}

function inline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

function md(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  const out = []; let kind = null, buf = [];
  const flush = () => {
    if (!buf.length){ kind = null; return; }
    if (kind === "p") out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    else if (kind === "ul") out.push("<ul>" + buf.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>");
    else if (kind === "table"){
      const rows = buf.filter(r => /[^|\-:\s]/.test(r))
        .map(r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim()));
      const [h, ...body] = rows;
      out.push('<div class="mdtable"><table><thead><tr>' + h.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>");
    }
    buf = []; kind = null;
  };
  for (const raw of lines){
    const line = raw.replace(/\s+$/, "");
    let k, val = line;
    if (!line.trim()) { flush(); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) k = "table";
    else if (/^\s*[-•]\s+/.test(line)) { k = "ul"; val = line.replace(/^\s*[-•]\s+/, ""); }
    else k = "p";
    if (k !== kind) flush();
    kind = k; buf.push(val);
  }
  flush();
  return out.join("");
}

const blankPart = () => ({ tab: "write", text: "", strokes: [], redo: [], photos: [], grid: true, height: 620 });
function partFromServer(r){
  r = r || {};
  return { tab: "write", text: r.text || "", strokes: Array.isArray(r.strokes) ? r.strokes : [], redo: [], grid: r.grid !== false, height: r.height || 620,
    photos: (r.photos || []).map(ph => typeof ph === "string" ? { path: ph, thumb: null } : ph).filter(ph => ph && ph.path).map(ph => ({ path: ph.path, thumb: ph.thumb || null })) };

function applyItem(d, item){
  d.status = item ? item.status : null; d.savedAt = item ? item.savedAt || "" : ""; d.submitted = item ? item.submitted || "" : "";
  d.attempt = item ? item.attempt || 0 : 0; d.feedback = item ? item.feedback || "" : ""; d.score = item && item.score != null ? Number(item.score) : null;
  if (item && item.points != null) d.points = Number(item.points);
}
function buildDraft(p, item){
  const n = Math.max(1, p.parts.length);
  const d = { pid: p.id, points: p.points, dirty: false,
    parts: Array.from({ length: n }, (_, i) => item && item.responses && item.responses[i] ? partFromServer(item.responses[i]) : blankPart()) };
  applyItem(d, item);
  if (EDITABLE(d.status)){
    const b = ss.get(draftKey(p.id));
    if (b && b.base === d.savedAt && Array.isArray(b.parts) && b.parts.length === n){
      d.parts = b.parts.map(x => Object.assign(blankPart(), x, { redo: [] })); d.dirty = true;
    }
  }
  d.parts.forEach(x => { x.tab = hasText(x) ? "write" : hasDraw(x) ? "draw" : hasPhoto(x) ? "photo" : "write"; });
  return d;
}
let backupT;
function markDirty(d){
  d.dirty = true; updateSaveNote(d);
  clearTimeout(backupT);
  backupT = setTimeout(() => ss.set(draftKey(d.pid), { base: d.savedAt, parts: d.parts.map(x => ({ text: x.text, strokes: x.strokes, photos: x.photos, grid: x.grid, height: x.height })) }), 600);
}
function updateSaveNote(d){
  const n = $("#save-note"); if (!n) return;
  n.textContent = d.dirty ? "You have unsaved changes" : d.savedAt ? "Saved " + fmtWhen(d.savedAt) : "Not saved yet";
  n.classList.toggle("unsaved", !!d.dirty);
}
const strokesAfterClear = st => { let i = st.length - 1; while (i >= 0 && !st[i].x) i--; return st.slice(i + 1); };
const hasDraw = x => strokesAfterClear(x.strokes).length > 0;
const hasText = x => !!x.text.trim();
const hasPhoto = x => x.photos.length > 0;

/* leaving a challenge with unsaved changes */
function currentDirty(){
  if (S.view !== "problem" || !S.me) return null;
  const d = S.drafts[S.pid];
  return d && d.dirty && EDITABLE(d.status) ? d : null;
}
function guardLeave(go){
  const d = currentDirty(); if (!d) return go();
  const p = myProblems().find(x => x.id === d.pid);
  const box = modal(`<h2>Save your work first?</h2><p class="muted">You made changes that aren't saved yet.</p>
    <div class="row"><button class="btn" type="button" id="g-save">Save and leave</button><button class="btn ghost" type="button" id="g-leave">Leave without saving</button><button class="btn ghost" type="button" id="g-stay">Stay here</button></div>`);
  $("#g-stay", box).onclick = closeModal;
  $("#g-leave", box).onclick = () => { closeModal(); ss.del(draftKey(d.pid)); delete S.drafts[d.pid]; go(); };
  $("#g-save", box).onclick = async () => { if (p && await persist(p, d, false)){ closeModal(); go(); } };
}
window.addEventListener("beforeunload", e => { if (currentDirty()){ e.preventDefault(); e.returnValue = ""; } });

function openProblem(pid){
  const d = S.drafts[pid]; if (d && !d.dirty) delete S.drafts[pid];   // always show the latest saved copy
  S.pid = pid; S.view = "problem"; renderStudent(); window.scrollTo(0, 0);
}

    ${d.feedback ? `<p style="margin-top:8px;white-space:pre-wrap"><b>Feedback:</b> ${esc(d.feedback)}</p>` : ""}</div>`;
  if (d.status === "Revise") return `<div class="note warn"><div class="row"><span class="pill rev">Sent back for changes</span></div>
    ${d.feedback ? `<p style="margin-top:8px;white-space:pre-wrap"><b>Feedback:</b> ${esc(d.feedback)}</p>` : ""}
    <p style="margin-top:6px">Make your changes, then turn it in again.</p></div>`;
  if (d.status === "Needs review") return `<div class="note"><div class="row"><span class="pill in">Turned in</span><span class="dim">${esc(fmtWhen(d.submitted))}</span></div>

}

        <div class="wtabs" role="tablist" aria-label="Ways to show your work"></div>

function renderWork(p, d, i){
  const sec = $(`.part[data-i="${i}"]`); const x = d.parts[i];
  const ro = !EDITABLE(d.status);
  const tabs = [["write", "Type it", hasText(x)], ["draw", "Draw it", hasDraw(x)], ["photo", "Photo", hasPhoto(x)]];
  $(".wtabs", sec).innerHTML = tabs.map(([k, l, has]) => `<button class="wtab" role="tab" type="button" data-k="${k}" aria-selected="${x.tab === k}">${l}${has ? '<span class="dot" aria-label="has work"></span>' : ""}</button>`).join("");
  $$(".wtab", sec).forEach(b => b.onclick = () => { x.tab = b.dataset.k; renderWork(p, d, i); });
  const area = $(".warea", sec);
  const changed = () => { markDirty(d); const has = { write: hasText(x), draw: hasDraw(x), photo: hasPhoto(x) };
    $$(".wtab", sec).forEach(b => { const dot = $(".dot", b); if (has[b.dataset.k] && !dot) b.insertAdjacentHTML("beforeend", '<span class="dot" aria-label="has work"></span>'); if (!has[b.dataset.k] && dot) dot.remove(); }); };
  if (x.tab === "write"){
    if (ro){ area.innerHTML = hasText(x) ? `<div class="rotext">${esc(x.text)}</div>` : `<p class="dim">Nothing typed for this part.</p>`; return; }
    const keys = ["²","³","√","π","×","÷","−","±","≤","≥","≠","≈","°","½","¼","¾","→"];
    area.innerHTML = `<div class="mkeys" aria-label="Math symbols">${keys.map(k => `<button type="button" class="mkey" data-k="${k}">${k}</button>`).join("")}</div>
      <textarea aria-label="Type your work for this part" placeholder="Write each step on its own line, and explain why you did it.">${esc(x.text)}</textarea>`;
    const ta = $("textarea", area);
    ta.oninput = () => { x.text = ta.value; changed(); };
    $$(".mkey", area).forEach(b => b.onclick = () => {
      const s = ta.selectionStart, e = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + b.dataset.k + ta.value.slice(e);
      ta.selectionStart = ta.selectionEnd = s + b.dataset.k.length; ta.focus(); x.text = ta.value; changed();
    });
  } else if (x.tab === "draw"){
    if (ro && !hasDraw(x)){ area.innerHTML = `<p class="dim">No drawing for this part.</p>`; return; }
    new Pad(area, x, changed, ro);
  } else {
    if (ro && !hasPhoto(x)){ area.innerHTML = `<p class="dim">No photos for this part.</p>`; return; }
    area.innerHTML = `<div class="phs">${x.photos.map((ph, j) => `<div class="ph">${ph.thumb || ph.data ? `<img src="${ph.thumb || ph.data}" alt="Photo ${j + 1} of your work">` : `<div class="phsaved">Photo ${j + 1} saved</div>`}${ro ? "" : `<button type="button" data-j="${j}" aria-label="Remove photo ${j + 1}">✕</button>`}</div>`).join("")}
      ${!ro && x.photos.length < 3 ? `<label class="addph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add a photo<input type="file" accept="image/*" multiple hidden></label>` : ""}</div>
      ${ro ? "" : `<p class="dim" style="margin-top:8px">Take a clear picture of your paper in good light. Up to 3 photos per part.</p>`}`;
    $$(".ph button", area).forEach(b => b.onclick = () => { x.photos.splice(+b.dataset.j, 1); changed(); renderWork(p, d, i); });
    const inp = $("input[type=file]", area);
    if (inp) inp.onchange = async () => {
      const files = Array.from(inp.files || []).slice(0, 3 - x.photos.length);
      for (const f of files){
        try { x.photos.push({ data: await shrinkImage(f), thumb: await shrinkImage(f, 420, 0.6) }); }
        catch { toast("That photo couldn't be opened. Try a JPG or PNG, or take a screenshot.", true); }
      }
      changed(); renderWork(p, d, i);
    };
  }
}

function shrinkImage(file, max = 1600, q = 0.82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

/* ---- drawing pad ---- */
const PEN_COLORS = [["#1d1638","Black"],["#2f6bff","Blue"],["#e0244d","Red"],["#13955a","Green"]];
const PAD_W = 1000;
class Pad {
  constructor(host, st, onChange, readonly){
    this.st = st; this.onChange = onChange;
    this.color = st.color || PEN_COLORS[0][0]; this.size = st.size || 4; this.erase = false; this.sawPen = false;
    if (readonly){
      host.innerHTML = `<div class="pad-wrap"><canvas class="pad-bg"></canvas><canvas class="pad-ink ro" aria-label="Your drawing"></canvas></div>`;
      this.host = host; this.wrap = $(".pad-wrap", host); this.bg = $(".pad-bg", host); this.ink = $(".pad-ink", host);
      this.size_(); return;
    }
    host.innerHTML = `
      <div class="pad-tools" role="toolbar" aria-label="Drawing tools">
        <div class="tg">${PEN_COLORS.map(([c, n]) => `<button type="button" class="sw" data-c="${c}" style="--sw:${c}" aria-label="${n} pen"></button>`).join("")}</div>
        <div class="tg"><button type="button" class="tb" data-s="3">Thin</button><button type="button" class="tb" data-s="7">Thick</button><button type="button" class="tb" data-a="erase">Eraser</button></div>
        <div class="tg"><button type="button" class="tb" data-a="undo">Undo</button><button type="button" class="tb" data-a="redo">Redo</button><button type="button" class="tb" data-a="clear">Clear</button></div>
        <div class="tg"><button type="button" class="tb" data-a="grid">Graph paper</button></div>
      </div>
      <div class="pad-wrap"><canvas class="pad-bg"></canvas><canvas class="pad-ink" aria-label="Drawing area"></canvas></div>
      <div class="pad-foot"><button type="button" class="btn ghost sm" data-a="more">+ More room</button><span class="dim">Use a stylus, your finger, or a mouse.</span></div>`;
    this.host = host; this.wrap = $(".pad-wrap", host); this.bg = $(".pad-bg", host); this.ink = $(".pad-ink", host);
    this.size_(); this.bind(); this.tools();
  }
  size_(){
    const h = this.st.height;
    this.wrap.style.aspectRatio = PAD_W + " / " + h;
    [this.bg, this.ink].forEach(c => { c.width = PAD_W; c.height = h; });
    this.drawBg(); this.redraw();
  }
  drawBg(){ const g = this.bg.getContext("2d"); Pad.paper(g, PAD_W, this.st.height, this.st.grid); }
  static paper(g, w, h, grid){
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    if (!grid) return;
    g.lineWidth = 1;
    for (let x = 40; x < w; x += 40){ g.strokeStyle = x % 200 ? "#e4ebf7" : "#cdd9ef"; g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, h); g.stroke(); }
    for (let y = 40; y < h; y += 40){ g.strokeStyle = y % 200 ? "#e4ebf7" : "#cdd9ef"; g.beginPath(); g.moveTo(0, y + .5); g.lineTo(w, y + .5); g.stroke(); }
  }
  static stroke(g, s, from = 0){
    const p = s.p; if (!p.length) return;
    g.globalCompositeOperation = s.e ? "destination-out" : "source-over";
    g.strokeStyle = g.fillStyle = s.c; g.lineWidth = s.e ? 30 : s.w; g.lineCap = "round"; g.lineJoin = "round";
    if (p.length === 1){ g.beginPath(); g.arc(p[0][0], p[0][1], g.lineWidth / 2, 0, Math.PI * 2); g.fill(); }
    else { g.beginPath(); const a = Math.max(0, from - 1); g.moveTo(p[a][0], p[a][1]); for (let i = a + 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]); g.stroke(); }
    g.globalCompositeOperation = "source-over";
  }
  redraw(){
    const g = this.ink.getContext("2d"); g.clearRect(0, 0, PAD_W, this.st.height);
    strokesAfterClear(this.st.strokes).forEach(s => Pad.stroke(g, s));
    this.tools();
  }
  pt(e){ const r = this.ink.getBoundingClientRect(); const k = PAD_W / r.width;
    return [Math.round((e.clientX - r.left) * k * 10) / 10, Math.round((e.clientY - r.top) * k * 10) / 10]; }
  bind(){
    const c = this.ink, g = c.getContext("2d");
    c.addEventListener("pointerdown", e => {
      if (e.pointerType === "pen") this.sawPen = true;
      if (e.pointerType === "touch" && this.sawPen) return;
      if (e.button > 0) return;
      e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch {}
      this.active = e.pointerId; this.cur = { c: this.color, w: this.size, e: this.erase, p: [this.pt(e)] };
      Pad.stroke(g, this.cur);
    });
    c.addEventListener("pointermove", e => {
      if (e.pointerId !== this.active || !this.cur) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      const from = this.cur.p.length;
      (evs.length ? evs : [e]).forEach(ev => this.cur.p.push(this.pt(ev)));
      Pad.stroke(g, this.cur, from);
    });
    const end = e => {
      if (e.pointerId !== this.active || !this.cur) return;
      this.st.strokes.push(this.cur); this.st.redo = []; this.cur = null; this.active = null;
      if (this.erase) this.redraw(); else this.tools();
      this.onChange();
    };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end); c.addEventListener("lostpointercapture", end);
    this.host.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.c){ this.color = this.st.color = b.dataset.c; this.erase = false; }
      else if (b.dataset.s){ this.size = this.st.size = +b.dataset.s; this.erase = false; }
      else if (b.dataset.a === "erase") this.erase = !this.erase;
      else if (b.dataset.a === "undo"){ if (this.st.strokes.length){ this.st.redo.push(this.st.strokes.pop()); this.redraw(); this.onChange(); } }
      else if (b.dataset.a === "redo"){ if (this.st.redo.length){ this.st.strokes.push(this.st.redo.pop()); this.redraw(); this.onChange(); } }
      else if (b.dataset.a === "clear"){ if (hasDraw(this.st)){ this.st.strokes.push({ x: 1, p: [] }); this.st.redo = []; this.redraw(); this.onChange(); toast("Cleared. Press Undo to bring it back."); } }
      else if (b.dataset.a === "grid"){ this.st.grid = !this.st.grid; this.drawBg(); this.onChange(); }
      else if (b.dataset.a === "more"){ if (this.st.height < 3000){ this.st.height += 360; this.size_(); this.onChange(); } else toast("That's as big as it gets. Try a photo for really long work."); }
      this.tools();
    });
  }
  tools(){
    $$(".sw", this.host).forEach(b => b.setAttribute("aria-pressed", String(!this.erase && b.dataset.c === this.color)));
    $$("[data-s]", this.host).forEach(b => b.setAttribute("aria-pressed", String(!this.erase && +b.dataset.s === this.size)));
    const er = $('[data-a="erase"]', this.host); if (er) er.setAttribute("aria-pressed", String(this.erase));
    const gr = $('[data-a="grid"]', this.host); if (gr) gr.setAttribute("aria-pressed", String(!!this.st.grid));
    const u = $('[data-a="undo"]', this.host); if (u) u.disabled = !this.st.strokes.length;
    const r = $('[data-a="redo"]', this.host); if (r) r.disabled = !this.st.redo.length;
    const cl = $('[data-a="clear"]', this.host); if (cl) cl.disabled = !hasDraw(this.st);
  }
  static exportPNG(st){
    const strokes = strokesAfterClear(st.strokes || []); if (!strokes.length) return null;
    // crop height to the drawn content (+ margin) so pictures aren't mostly blank
    let maxY = 0; strokes.forEach(s => { if (!s.e) s.p.forEach(q => { if (q[1] > maxY) maxY = q[1]; }); });
    const h = Math.min(st.height, Math.max(300, Math.ceil((maxY + 60) / 40) * 40));
    const ink = document.createElement("canvas"); ink.width = PAD_W; ink.height = st.height;
    const gi = ink.getContext("2d"); strokes.forEach(s => Pad.stroke(gi, s));
    const c = document.createElement("canvas"); c.width = PAD_W; c.height = h;
    const g = c.getContext("2d"); Pad.paper(g, PAD_W, h, st.grid); g.drawImage(ink, 0, 0);
    return c.toDataURL("image/png");
  }
}

/* ---- save, turn in, unsubmit ---- */
async function persist(p, d, submit){
  modal(`<div class="stack" style="align-items:center;text-align:center;padding:16px 0"><div class="spin" aria-hidden="true"></div><h2>${submit ? "Turning in your work…" : "Saving your work…"}</h2><p class="muted">Photos can take a few seconds. Please don't close this page.</p></div>`, { locked: true });
  try {
    const responses = d.parts.map((x, i) => ({ part: p.parts.length ? LETTERS[i] : "", text: x.text, strokes: strokesAfterClear(x.strokes), height: x.height, grid: x.grid, photos: x.photos }));
    const res = await api("saveWork", { name: S.me.name, cls: S.me.cls, pin: S.me.pin, problemId: p.id, responses, submit });
    d.parts.forEach(x => { x.strokes = strokesAfterClear(x.strokes); x.redo = []; });
    applyItem(d, res.item); d.dirty = false; ss.del(draftKey(p.id));
    if (Array.isArray(res.work)) S.work = res.work;
    return true;
  } catch (e){
    const box = modal(`<h2>That didn't go through</h2><p>${esc(errMsg(e))}</p><p class="muted">Your work is still on this page. Try again in a moment.</p><div class="row"><button class="btn" type="button" id="m-ok">OK</button></div>`);
    $("#m-ok", box).onclick = closeModal;
    return false;
  }
}
function confirmSubmit(p, d){
  const labels = p.parts.length ? p.parts.map((_, i) => "Part " + LETTERS[i]) : ["Your work"];
  const rows = d.parts.map((x, i) => {
    const what = [hasText(x) && "typed", hasDraw(x) && "drawing", hasPhoto(x) && (x.photos.length + " photo" + (x.photos.length > 1 ? "s" : ""))].filter(Boolean);
    return { label: labels[i], what, ok: what.length > 0 };
  });
  const any = rows.some(r => r.ok), missing = rows.filter(r => !r.ok).length;
  const box = modal(`
    <h2>Ready to turn it in?</h2>
    <ul class="checks">${rows.map(r => `<li><span class="${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "!"}</span><b>${esc(r.label)}</b><span class="muted">${r.ok ? esc(r.what.join(" + ")) : "Nothing yet"}</span></li>`).join("")}</ul>
    ${!any ? `<p class="err">Add some work before you turn it in.</p>` : missing ? `<div class="note warn">${missing === 1 ? "One part is" : missing + " parts are"} empty. You can still turn it in, but you might miss points.</div>` : `<div class="note">Did you explain your thinking, not just the answer? Explanations earn the most points.</div>`}
    <p class="dim">After you turn it in, you can still unsubmit and make changes until your teacher grades it.</p>
    <div class="row"><button class="btn" type="button" id="m-go" ${any ? "" : "disabled"}>Turn it in</button><button class="btn ghost" type="button" id="m-no">Keep working</button></div>`);
  $("#m-no", box).onclick = closeModal;
  $("#m-go", box).onclick = async () => {

function downloadCSV(list){
  const cell = v => { const t = String(v == null ? "" : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const head = ["Turned in","Student","Class","Challenge","Try","Status","Score","Out of","Feedback","Typed work"];
  const rows = list.map(s => [fmtWhen(s.submitted || s.savedAt), s.student, s.cls, s.problem, s.attempt, s.status, s.score == null ? "" : s.score, s.points, s.feedback,
    s.responses.filter(r => (r.text || "").trim()).map(r => (r.part ? r.part + ") " : "") + r.text).join(" | ")]);
  const csv = [head, ...rows].map(r => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = "think-bigger-scores-" + todayISO() + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function tPill(s){
  if (s.status === "Reviewed") return `<span class="pill done">${s.score != null ? "Graded " + s.score + "/" + s.points : "Graded"}</span>`;
  if (s.status === "Revise") return `<span class="pill rev">Sent back</span>`;
  if (s.status === "Draft") return `<span class="pill draft">Draft</span>`;
  return `<span class="pill in">Needs review</span>`;
}

const QUICK = ["Great explanation!","Clear, organized steps.","Show each step of your work.","Explain why, not just what.","Check your signs.","Check your arithmetic.","Label your units.","Revise and resubmit for full credit."];
function renderReviewOne(){
  const s = T().submissions.find(x => x.id === S.t.subId);

    <div class="row"><button class="link" type="button" id="back">← Back to list</button><span class="spacer"></span>
      ${qi >= 0 ? `<span class="dim">${qi + 1} of ${q.length}</span>` : ""}

      ${s.status === "Draft" ? `<div class="note warn">This is a draft. ${esc(s.student.split(/[\s,]+/)[0])} hasn't turned it in yet${s.attempt ? " (they unsubmitted it to make changes)" : ""}, so it can't be graded.</div>` : ""}

      ${p ? `<details><summary style="cursor:pointer;font-weight:800;color:var(--violet-d)">Show the challenge</summary><div class="prompt" style="margin-top:10px">${md(p.prompt)}</div></details>` : `<p class="dim">This challenge was deleted.</p>`}
    </section>
    ${s.responses.map((r, i) => `
      <section class="resp">
        <div class="part-h"><span class="part-l">${r.part ? esc(r.part) : "✓"}</span><div class="part-q">${parts && parts[i] ? md(parts[i]) : "<p>Work</p>"}</div></div>
        ${r.text ? `<div class="txt">${esc(r.text)}</div>` : ""}
        ${r.drawing || r.photos ? (imgs ? `${imgs[i] && imgs[i].drawing ? `<img src="${imgs[i].drawing}" alt="Student drawing for part ${esc(r.part)}">` : ""}${imgs[i] ? imgs[i].photos.map((u, j) => `<img src="${u}" alt="Student photo ${j + 1} for part ${esc(r.part)}">`).join("") : ""}`
          : `<p class="dim">Loading pictures…</p>`) : ""}
        ${!r.text && !r.drawing && !r.photos ? `<p class="dim">No work for this part.</p>` : ""}
      </section>`).join("")}
    ${s.status === "Draft" ? "" : `<section class="card stack" style="gap:12px">
      <h3>Your review</h3>
      <p class="dim"><b>Grade it</b> locks the work so it can't be changed. <b>Send back for changes</b> unlocks it so the student can edit and turn it in again.</p>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="width:130px"><label class="lbl" for="rv-s">Score</label><div class="row" style="flex-wrap:nowrap;gap:6px"><input type="number" id="rv-s" min="0" step="0.5" value="${s.score != null ? s.score : ""}"><span class="muted" style="white-space:nowrap">/ ${s.points}</span></div></div>
        <div class="field"><span class="lbl">Result</span><div class="seg" role="group" aria-label="Result"><button type="button" data-st="Reviewed">Grade it</button><button type="button" data-st="Revise">Send back for changes</button></div></div>
      </div>
      <div class="field"><label class="lbl" for="rv-f">Feedback for the student</label>
        <div class="chips" style="margin-bottom:8px">${QUICK.map(c => `<button type="button" class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join("")}</div>
        <textarea id="rv-f" style="min-height:90px">${esc(s.feedback)}</textarea></div>
      <div class="row"><button class="btn" type="button" id="rv-next">${nextId ? "Save & next" : "Save"}</button>${nextId ? `<button class="btn ghost" type="button" id="rv-save">Save</button>` : ""}<span class="err" id="rv-e" role="alert"></span></div>
    </section>`}`;
  typeset(app);
  let st = s.status === "Revise" ? "Revise" : "Reviewed";

      .catch(e => toast("Pictures didn't load: " + errMsg(e), true));
  }
}

      <div class="field"><span class="lbl">Classes (none selected = everyone)</span>${classes.length ? `<div class="chips" id="e-cls">${classes.map(c => `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${e.classes.some(x => x.toLowerCase() === c.toLowerCase())}">${esc(c)}</button>`).join("")}</div>` : `<p class="dim">Add your class list first to post to specific classes.</p>`}</div>
      <div class="field"><label class="lbl" for="e-prompt">The problem</label><textarea id="e-prompt" style="min-height:160px" placeholder="Set up the situation here.">${esc(e.prompt)}</textarea>
        <p class="dim" style="margin-top:6px">Math: wrap it in \\( and \\), like \\( 3x + 5 = 20 \\). Bold: **word**. Bullets: start a line with "- ". Tables: | a | b |</p></div>
      <div class="field"><span class="lbl">Picture (optional)</span>
        <div class="row" id="e-img"></div></div>
      <div class="field"><span class="lbl">Parts</span><div class="stack" id="e-parts" style="gap:8px"></div>
        <div style="margin-top:8px"><button class="btn ghost sm" type="button" id="e-addpart">+ Add a part</button></div></div>
      <p class="err" id="e-err" role="alert"></p>
      <div class="row"><button class="btn" type="button" id="e-save">${isNew ? "Save challenge" : "Save changes"}</button><button class="btn ghost" type="button" id="e-prev">Preview</button>
        <span class="spacer"></span>${isNew ? "" : `<button class="btn danger" type="button" id="e-del">Delete</button>`}</div>
    </section>`;
  const sync = () => {
    e.title = $("#e-title").value; e.type = $("#e-type").value; e.points = $("#e-pts").value; e.status = $("#e-status").value;
    e.postDate = $("#e-post").value; e.dueDate = $("#e-due").value; e.topics = $("#e-topics").value; e.prompt = $("#e-prompt").value;
    e.units = $$("#e-units .chip").filter(c => c.getAttribute("aria-pressed") === "true").map(c => c.dataset.u).join(", ");
    e.classes = $$("#e-cls .chip").filter(c => c.getAttribute("aria-pressed") === "true").map(c => c.dataset.c);
    e.parts = $$("#e-parts textarea").map(t => t.value);
  };
  const drawParts = () => {
    $("#e-parts").innerHTML = e.parts.map((t, i) => `<div class="partedit"><span class="part-l">${LETTERS[i]}</span><textarea aria-label="Part ${LETTERS[i]}">${esc(t)}</textarea><button class="btn ghost sm" type="button" data-rm="${i}" aria-label="Remove part ${LETTERS[i]}">✕</button></div>`).join("");
    $$("#e-parts [data-rm]").forEach(b => b.onclick = () => { sync(); e.parts.splice(+b.dataset.rm, 1); drawParts(); });
  };
  const drawImg = () => {
    const box = $("#e-img");
    const show = typeof e.image === "string" ? e.image : (e.image === undefined && e.hasImage ? "existing" : null);
    box.innerHTML = (show === "existing" ? `<span class="pill vis">Picture attached</span>` : show ? `<img class="imgprev" src="${show}" alt="Picture preview">` : "") +
      `<label class="btn ghost sm" style="cursor:pointer">${show ? "Replace picture" : "Add a picture"}<input type="file" accept="image/*" hidden></label>` +
      (show ? `<button class="btn ghost sm" type="button" id="e-rmimg">Remove picture</button>` : "");
    $("input", box).onchange = async ev => { const f = ev.target.files[0]; if (!f) return; try { e.image = await shrinkImage(f, 1400, 0.85); drawImg(); } catch { toast("That picture couldn't be opened.", true); } };
    const rm = $("#e-rmimg"); if (rm) rm.onclick = () => { e.image = null; e.hasImage = false; drawImg(); };
  };
  drawParts(); drawImg();
  $$("#e-units .chip, #e-cls .chip").forEach(c => c.onclick = () => c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true")));
  $("#e-addpart").onclick = () => { sync(); if (e.parts.length < 12){ e.parts.push(""); drawParts(); $$("#e-parts textarea").pop().focus(); } };
  $("#back").onclick = () => { S.t.edit = null; renderTeacher(); };
  $("#e-prev").onclick = () => { sync(); previewProblem(e); };
  $("#e-save").onclick = async () => {
    sync(); $("#e-err").textContent = "";
    if (!e.title.trim()){ $("#e-err").textContent = "Give the challenge a title."; return; }
    const b = $("#e-save"); b.disabled = true; b.textContent = "Saving…";
    try {
      await api("saveProblem", S.t.pass, { id: e.id, status: e.status, postDate: e.postDate, dueDate: e.dueDate, title: e.title, type: e.type, units: e.units, topics: e.topics, points: e.points, classes: e.classes, prompt: e.prompt, parts: e.parts, image: e.image });
      toast("Challenge saved"); S.t.edit = null; await loadTeacher(true);
    } catch (err){ $("#e-err").textContent = errMsg(err); b.disabled = false; b.textContent = "Save"; }
  };
  const del = $("#e-del");
  if (del) del.onclick = () => {
    const box = modal(`<h2>Delete “${esc(e.title)}”?</h2><p class="muted">Students won't see it anymore. Work already turned in stays in your data sheet.</p><div class="row"><button class="btn danger" type="button" id="m-y">Delete it</button><button class="btn ghost" type="button" id="m-n">Cancel</button></div>`);
    $("#m-n", box).onclick = closeModal;
    $("#m-y", box).onclick = async () => { try { await api("deleteProblem", S.t.pass, e.id); closeModal(); toast("Deleted"); S.t.edit = null; await loadTeacher(true); } catch (err){ closeModal(); toast(errMsg(err), true); } };
  };
}

function previewProblem(e){
  const parts = e.parts.filter(x => String(x).trim());
  const box = modal(`
    <div class="row"><span class="badge" style="background:${typeColor(e.type)}">${esc(e.type)}</span><span class="badge" style="background:#f1eff7">${esc(e.points)} points</span></div>
    <h2>${esc(e.title || "Untitled")}</h2>
    <div class="prompt">${md(e.prompt)}${typeof e.image === "string" ? `<img src="${e.image}" alt="">` : ""}</div>
    ${parts.map((q, i) => `<div class="part-h"><span class="part-l">${LETTERS[i]}</span><div class="part-q">${md(q)}</div></div>`).join("")}
    <div><button class="btn ghost" type="button" id="m-x">Close preview</button></div>`, { wide: true });
  typeset(box); $("#m-x", box).onclick = closeModal;
}

/* ---- import from Claude ---- */
const IMPORT_EXAMPLE = `### The Gym Membership Decision
Type: Real-World Decision
Units: 3, 4
Topics: Equations with variables on both sides; percent
Points: 5
Post: ${todayISO()}
Due:
Classes:
Gym A costs $40 to join plus $25 a month. Gym B has no joining fee and costs $30 a month.
a) Write an expression for the total cost of each gym after \\( m \\) months.
b) After how many months do the gyms cost the same? Show your work.
c) Your friend says Gym B is always the better deal. Is your friend right? Explain.`;
function parseImport(text){
  const blocks = String(text || "").replace(/\r/g, "").split(/^###\s+/m).map(b => b.trim()).filter(Boolean);
  const out = [], warn = [];
  blocks.forEach((b, bi) => {
    const lines = b.split("\n"); const p = { title: lines.shift().trim(), status: "Visible", postDate: "", dueDate: "", type: "Multistep Challenge", units: "", topics: "", points: 5, classes: [], prompt: "", parts: [] };
    let inBody = false, cur = null; const prompt = [];
    for (const raw of lines){
      const line = raw.replace(/\s+$/, "");
      const meta = !inBody && /^(type|units?|topics?|points?|post(?: date)?|due(?: date)?|classes?|status|prompt)\s*:\s*(.*)$/i.exec(line.trim());
      if (meta){
        const k = meta[1].toLowerCase(), v = meta[2].trim();
        if (k === "type") p.type = v || p.type;
        else if (k.startsWith("unit")) p.units = unitList(v).join(", ");
        else if (k.startsWith("topic")) p.topics = v;
        else if (k.startsWith("point")) p.points = Number(v) || 0;
        else if (k.startsWith("post")) p.postDate = v;
        else if (k.startsWith("due")) p.dueDate = v;
        else if (k.startsWith("class")) p.classes = v.split(/[,;]/).map(x => x.trim()).filter(Boolean);
        else if (k === "status") p.status = /hid/i.test(v) ? "Hidden" : "Visible";
        else if (k === "prompt"){ inBody = true; if (v) prompt.push(v); }
        continue;
      }
      if (!inBody && !line.trim()) continue;
      inBody = true;
      const pm = /^\s*([a-l])\)\s+(.*)$/.exec(line);
      if (pm){ cur = pm[2]; p.parts.push(cur); continue; }
      if (p.parts.length) p.parts[p.parts.length - 1] += "\n" + line;
      else prompt.push(line);
    }
    p.prompt = prompt.join("\n").trim();
    p.parts = p.parts.map(x => x.trim());
    [["postDate","Post"],["dueDate","Due"]].forEach(([k, l]) => { if (p[k] && !/^\d{4}-\d{2}-\d{2}$/.test(p[k])){ warn.push(`“${p.title}”: ${l} date should look like 2026-11-09. It was left blank.`); p[k] = ""; } });
    if (!p.title) warn.push(`Challenge ${bi + 1} has no title.`);
    else out.push(p);
  });
  return { list: out, warn };
}
function renderImport(){
  app.innerHTML = `
    <div><button class="link" type="button" id="back">← All challenges</button></div>
    <section class="card stack">
      <h2>Paste challenges from Claude</h2>
      <p class="muted">Ask Claude for this week's challenges “in Think Bigger import format,” then paste everything here. You can add several challenges at once.</p>
      <textarea id="im-t" style="min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem" placeholder="### Challenge title&#10;Type: …&#10;…"></textarea>
      <details><summary style="cursor:pointer;font-weight:800;color:var(--violet-d)">What the format looks like</summary><div class="fmt" style="margin-top:8px">${esc(IMPORT_EXAMPLE)}</div>
        <p class="dim" style="margin-top:6px">Each challenge starts with ###. Lines starting a), b), c) become parts. You'll pick classes after you click Check it.</p></details>
      <div class="row"><button class="btn" type="button" id="im-read">Check it</button></div>
      <div id="im-out" class="stack" style="gap:10px"></div>
    </section>`;
  $("#back").onclick = () => { S.t.view = "challenges"; renderTeacher(); };
  $("#im-read").onclick = () => {
    const { list, warn } = parseImport($("#im-t").value);
    const out = $("#im-out");
    if (!list.length){ out.innerHTML = `<p class="err">No challenges found. Each one should start with ### and a title.</p>`; return; }
    const classes = classOptions();
    const canon = c => classes.find(x => x.toLowerCase() === c.toLowerCase()) || c;
    list.forEach(p => { p.classes = [...new Set(p.classes.map(canon))]; p.include = true; });
    const unknown = [...new Set(list.flatMap(p => p.classes).filter(c => !classes.includes(c)))];
    const all = classes.concat(unknown);
    const chosen = () => list.filter(p => p.include);
    const draw = () => {
      const inc = chosen();
      const everyHas = c => inc.length > 0 && inc.every(p => p.classes.includes(c));
      const allEveryone = inc.length > 0 && inc.every(p => !p.classes.length);
      out.innerHTML = `${warn.map(w => `<div class="note warn">${esc(w)}</div>`).join("")}
        ${unknown.length ? `<div class="note warn">${unknown.map(c => `“${esc(c)}”`).join(", ")} ${unknown.length > 1 ? "aren't" : "isn't"} on your class list, so no student would see challenges assigned only to ${unknown.length > 1 ? "them" : "it"}. Unselect ${unknown.length > 1 ? "them" : "it"} below, or fix the name on your class list.</div>` : ""}
        <h3>Found ${list.length} challenge${list.length > 1 ? "s" : ""}</h3>
        ${classes.length ? `<div class="pv" style="background:var(--violet-l);border-color:transparent">
          <b>Which classes get these?</b>
          <p class="dim">Pick classes here to set every checked challenge at once, or change each challenge below. When no class is picked, every class sees it.</p>
          <div class="chips"><button type="button" class="chip" data-all="1" aria-pressed="${allEveryone}">Every class</button>${all.map((c, i) => `<button type="button" class="chip" data-gc="${i}" aria-pressed="${everyHas(c)}">${esc(c)}</button>`).join("")}</div>
        </div>` : `<p class="dim">Add your class list to send challenges to specific classes. For now, every class will see them.</p>`}
        <div class="stack" style="gap:8px">${list.map((p, k) => `<div class="pv" style="${p.include ? "" : "opacity:.55"}">
          <div class="row"><label class="row" style="gap:8px;cursor:pointer;flex:1;min-width:12em"><input type="checkbox" data-inc="${k}" ${p.include ? "checked" : ""} aria-label="Add ${esc(p.title)}">
            <span class="badge" style="background:${typeColor(p.type)}">${esc(p.type)}</span><b>${esc(p.title)}</b></label></div>
          <span class="dim">${esc([unitLabel(p.units), p.points + " pts", p.parts.length + " parts", p.postDate ? "posts " + fmtShort(p.postDate) : "posts now", p.dueDate ? "due " + fmtShort(p.dueDate) : ""].filter(Boolean).join(" · "))}</span>
          ${all.length && p.include ? `<div class="chips"><span class="dim" style="align-self:center;font-weight:700">For:</span>${all.map((c, i) => `<button type="button" class="chip" data-k="${k}" data-c="${i}" aria-pressed="${p.classes.includes(c)}">${esc(c)}</button>`).join("")}${p.classes.length ? "" : `<span class="dim" style="align-self:center">every class</span>`}</div>` : ""}
        </div>`).join("")}</div>
        <div class="row"><div class="field"><label class="lbl" for="im-st">Students can see them?</label><select id="im-st"><option value="keep">Yes, on each post date</option><option value="Hidden">No, add them hidden for now</option></select></div></div>
        <div class="row"><button class="btn" type="button" id="im-go" ${inc.length ? "" : "disabled"}>Add ${inc.length} challenge${inc.length === 1 ? "" : "s"}</button><button class="btn ghost" type="button" id="im-pv">Preview the first one</button></div>`;
      const keepSt = S.t.imSt; if (keepSt) $("#im-st").value = keepSt;
      $("#im-st").onchange = e => S.t.imSt = e.target.value;
      $$("[data-inc]", out).forEach(cb => cb.onchange = () => { list[+cb.dataset.inc].include = cb.checked; draw(); });
      const allBtn = $("[data-all]", out); if (allBtn) allBtn.onclick = () => { chosen().forEach(p => p.classes = []); draw(); };
      $$("[data-gc]", out).forEach(b => b.onclick = () => {
        const c = all[+b.dataset.gc], on = everyHas(c);
        chosen().forEach(p => { p.classes = on ? p.classes.filter(x => x !== c) : [...new Set(p.classes.concat(c))]; });
        draw();
      });
      $$("[data-c]", out).forEach(b => b.onclick = () => {
        const p = list[+b.dataset.k], c = all[+b.dataset.c];
        p.classes = p.classes.includes(c) ? p.classes.filter(x => x !== c) : p.classes.concat(c);
        draw();
      });
      $("#im-pv").onclick = () => previewProblem(chosen()[0] || list[0]);
      $("#im-go").onclick = async () => {
        const b = $("#im-go"); b.disabled = true; b.textContent = "Adding…";
        const hide = $("#im-st").value === "Hidden"; const add = chosen();
        try {
          await api("importProblems", S.t.pass, add.map(p => Object.assign({}, p, hide ? { status: "Hidden" } : {})));
          toast(`Added ${add.length} challenge${add.length > 1 ? "s" : ""}`); S.t.imSt = null; S.t.view = "challenges"; await loadTeacher(true);
        } catch (e){ toast(errMsg(e), true); b.disabled = false; b.textContent = "Try again"; }
      };
    };
    draw();
  };
}

/* ---- roster ---- */
function renderRoster(){
  const rows = S.t.rows || (S.t.rows = T().roster.map(r => Object.assign({}, r)));
  const classes = [...new Set(rows.map(r => r.cls))].filter(Boolean).sort((a, b) => a.localeCompare(b, undefined, {numeric:true}));
  app.innerHTML = `
    <div class="row"><h2 style="flex:1">Class list</h2><span class="dim">${rows.length} students${classes.length ? " · " + classes.length + " classes" : ""}</span></div>
    <section class="card stack" style="gap:12px">
      <h3>Add a whole class at once</h3>
      <div class="grid2">
        <div class="field"><label class="lbl" for="r-cls">Class name</label><input type="text" id="r-cls" list="r-cls-list" placeholder="e.g. Pre-Algebra P2"><datalist id="r-cls-list">${classes.map(c => `<option>${esc(c)}</option>`).join("")}</datalist></div>
        <div class="field"><label class="lbl" for="r-names">Student names (one per line)</label><textarea id="r-names" style="min-height:110px" placeholder="Ana Rivera&#10;Jordan Lee&#10;…"></textarea></div>
      </div>
      <div><button class="btn ghost" type="button" id="r-add">Add to the list</button></div>
    </section>
    <section class="card stack" style="gap:12px">
      <div class="row"><h3 style="flex:1">Everyone</h3><button class="btn ghost sm" type="button" id="r-pins">Make PINs for anyone without one</button></div>
      <p class="dim">PINs are optional. If a student has one, they type it after picking their name, so classmates can't turn in work as them.</p>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Class</th><th>PIN</th><th>Active</th><th></th></tr></thead><tbody>
        ${rows.map((r, i) => `<tr><td><input type="text" data-i="${i}" data-k="name" value="${esc(r.name)}" aria-label="Name"></td><td><input type="text" data-i="${i}" data-k="cls" value="${esc(r.cls)}" aria-label="Class" list="r-cls-list"></td>
          <td style="width:110px"><input type="text" data-i="${i}" data-k="pin" value="${esc(r.pin)}" aria-label="PIN"></td>
          <td><input type="checkbox" data-i="${i}" data-k="active" ${r.active !== false ? "checked" : ""} aria-label="Active"></td>
          <td><button class="btn ghost sm" type="button" data-rm="${i}" aria-label="Remove ${esc(r.name)}">✕</button></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">No students yet. Add a class above.</p>`}
      <div class="row"><button class="btn" type="button" id="r-save">Save class list</button><span class="dim" id="r-msg"></span></div>
    </section>`;
  const dirty = () => { $("#r-msg").textContent = "Unsaved changes"; };
  $$("input[data-k]").forEach(inp => inp.oninput = inp.onchange = () => { const r = rows[+inp.dataset.i]; if (inp.type === "checkbox") r.active = inp.checked; else r[inp.dataset.k] = inp.value; dirty(); });
  $$("[data-rm]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); renderRoster(); dirty(); });
  $("#r-add").onclick = () => {
    const cls = $("#r-cls").value.trim(); const names = $("#r-names").value.split("\n").map(x => x.split("\t")[0].trim()).filter(Boolean);
    if (!cls || !names.length){ toast("Type a class name and at least one student.", true); return; }
    names.forEach(n => { if (!rows.some(r => r.name.toLowerCase() === n.toLowerCase() && r.cls.toLowerCase() === cls.toLowerCase())) rows.push({ name: n, cls, pin: "", active: true }); });
    renderRoster(); dirty();
  };
  $("#r-pins").onclick = () => { let n = 0; rows.forEach(r => { if (!String(r.pin).trim()){ r.pin = String(1000 + Math.floor(Math.random() * 9000)); n++; } }); renderRoster(); if (n) dirty(); toast(n ? `Made ${n} PINs. Save to keep them.` : "Everyone already has a PIN."); };
  $("#r-save").onclick = async () => {
    const b = $("#r-save"); b.disabled = true;
    try { const n = await api("saveRoster", S.t.pass, rows); toast(`Saved ${n} students`); S.t.rows = null; await loadTeacher(true); }
    catch (e){ toast(errMsg(e), true); b.disabled = false; }
  };
}

/* ============ go ============ */
if (START_VIEW === "teacher") startTeacher(); else startStudent();
})();
